# Нарезка — особенности контроллера PCC3300 (поверх _defaults)

# Подтверждение выхода из стопа (v5.1.16): бит «Готов к нагрузке» панели.
# 40408/7 ReadyToLoad обычно встаёт вместе с номиналом (13.10 13:12:26 — ровно
# со сменой состояния; 24.10 13:40:11 — в одном кадре с прокруткой) и гаснет до
# перехода в стоп (32 цикла из 33 по истории ДЭС №3). Но может пережить стоп:
# 24.10 держался с 13.10 14:59:49 при 0 об/мин и ложно подтвердил попытку
# 12:41:05. С v5.1.25 бит, вставший раньше стопа перед попыткой, не засчитывается
# (П1), а при показаниях оборотов/частоты ниже порогов один бит не подтверждает
# (П2). 40430/1 с тем же именем в карте битов по данным означает аварийный
# останов — им подтверждать нельзя.
transition_confirm:
  ready_bits:
    - {addr: 40408, bit: 7}

# Оценка работы за обрыв связи по счётчику наработки (v5.1.25, П10): шаг
# счётчика 40070 у PCC3300 — 0,05 ч
no_data_estimate:
  engine_hours_step_sec: 180

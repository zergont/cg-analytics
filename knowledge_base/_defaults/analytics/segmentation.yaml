# Параметры алгоритма сегментации KTA50/PCC3300
# Источник: ТЗ аналитики, разделы 5.1–5.4
# Изменение: только через веб-морду (раздел 9 ТЗ)

# ─── ПРЕАМБУЛА ───────────────────────────────────────────────────────────────
# При открытии нового сегмента (смена 40011) в него включается преамбула:
# последние N аналоговых срезов ПЕРЕД фронтом смены из предыдущего сегмента.
# Цель — захватить значения, ставшие причиной смены режима.

preamble:
  slices: 3
  description: >
    Число срезов до фронта смены RUN_STATE, включаемых в новый сегмент.
    Применяется к аналоговым регистрам. Дискретные события режутся мгновенно.
  _source: TUNABLE

# ─── ПОДТВЕРЖДЕНИЕ ГРАНИЦЫ ЗОНЫ ─────────────────────────────────────────────
# Защита от ложного реза на границах зон нагрузки (только для непрерывных параметров).
# НЕ применяется к дискретным границам (смена 40011, fault-событие).

boundary_confirmation:
  n_stab: 3
  description: >
    Число последовательных срезов в новой зоне нагрузки для подтверждения перехода.
    Граница ставится ретроспективно по срезу первого отклонения (не по срезу подтверждения).
    Если значение вернулось в исходную зону раньше — это выброс, граница не создаётся.
  _source: TUNABLE

# ─── КАЧЕСТВО ДАННЫХ ─────────────────────────────────────────────────────────
# Критерии для пометки невычислимых скоростей и пониженного data_quality.

data_quality:
  # Максимальный интервал между записями (в единицах heartbeat_nominal_sec).
  # Если Δt > heartbeat_nominal_sec × heartbeat_max_multiplier — считаем разрывом.
  heartbeat_nominal_sec: 30    # номинальный интервал опроса Modbus (сек)
  heartbeat_max_multiplier: 3  # Δt > 30 × 3 = 90 сек → аномальный пропуск
  # Регистр-пинг: всегда меняется при каждом опросе (счётчик или время).
  # Используется как точный индикатор качества связи вместо усреднения по всем регистрам
  # (большинство регистров работают «report-by-exception» и почти не меняются в стабильном режиме).
  # data_quality = actual_ping_rows / expected_rows (duration / heartbeat_nominal_sec)
  heartbeat_addr: 40290
  description: >
    Скорости (V-метрики) через разрывы не вычисляются.
    data_quality считается по регистру-пингу (heartbeat_addr): число пришедших
    пакетов / ожидаемое число (duration / heartbeat_nominal_sec).
    Если heartbeat_addr не задан или нет данных — fallback на покрытие активных регистров.
  _source: TUNABLE

# ─── ИСТОЧНИК LOAD_PCT ───────────────────────────────────────────────────────
# Приоритет источников для определения зоны нагрузки.
# Используется в сегментации L2 (подсегменты внутри RUN_STATE=3).

# ─── КЛАССЫ СКОРОСТНЫХ МЕТРИК (Addendum v1.3) ────────────────────────────────
# Класс A (быстрые/безынерционные): ACTIVE_POWER, CURRENT, FREQUENCY, dRPM/dt
#   Мгновенная двухточечная скорость валидна. Только в RUN_STATE=3.
#
# Класс B (медленные/инерционные): OIL_PRESS, OIL_TEMP, COOLANT_TEMP, RPM stability
#   Диагностичен только устойчивый тренд по ≥ N_trend последовательным срезам.
#   Мгновенный «скачок» на двух точках — шум/квантование АЦП, не диагноз.

class_b_trend:
  N_trend: 3             # минимум реальных срезов для тренда класса B
                         # (при N_trend=3 и heartbeat=20с → ~40 сек устойчивого тренда)
  roles:                 # роли класса B (тренд вместо двухточечной скорости)
    - OIL_PRESS
    - OIL_TEMP
    - COOLANT_TEMP
    - RPM_STABILITY      # стабильность оборотов под нагрузкой (не быстрый отклик)

# ─── РЕЖИМНЫЕ ПЕРЕХОДЫ ──────────────────────────────────────────────────────
transitions:
  T_spinup_sec: 20          # норматив времени разгона ХХ→номинал (сек)
  T_stop_max_sec: 30        # максимальное время до RPM=0 после команды Stop.
                             # Дольше — «замедленный останов» (наблюдение, без уровня).
                             # Паспортного норматива нет (зависит от инерции ротора);
                             # 30 сек — практический ориентир.
  T_stop_violation_sec: 90  # «обороты не упали» — только если за это время RPM так и
                             # не упали (самый медленный штатный за 60 дней — 74 с).
                             # Наблюдение без уровня: отказ останова выставляет панель
                             # (код 1245), аналитика не дублирует (v5.1.7)
  rpm_stopped_threshold: 50  # RPM ниже этого = «двигатель остановлен» (rpm)
  # Контекст проверок перехода (v5.1.10): цепочка закрытых сегментов перед окном
  joint_tol_sec: 2           # стык звеньев: зазор больше — проверка на стыке не делается
  chain_max_links: 8         # сколько звеньев назад искать работу / стоп
  _source: TUNABLE

load_pct_source:
  primary_addr: 40014          # приоритетный: регистр LOAD_PCT (standby)
  fallback_role: ACTIVE_POWER_TOTAL  # запасной: 40034 / RATING_KW * 100
  rating_kw_addr: 43019        # номинал для вычисления % из кВт
  description: >
    Если значение primary_addr отсутствует или невалидно (None / N/A),
    вычисляем LOAD_PCT = ACTIVE_POWER_TOTAL / RATING_KW * 100.
  _source: TUNABLE

# ─── РЕЗ СТОП-ПЕРИОДА ПО УСТРАНЕНИЮ НЕИСПРАВНОСТЕЙ (v4.9.38) ────────────────
# «СТОП (авария)» → FAULT_CLEARED → «СТОП (готов к пуску)»: даёт метрику
# времени устранения и зелёный сегмент готовности в календаре.
# «Грязно» = активен не-INFO бит масок ИЛИ несброшенный код 40012.

fault_cleared:
  enabled: true
  # Чистота должна продержаться не меньше этого времени, иначе реза нет
  # (защита от «сброс → через минуту кнопка/новый код»). Граница ставится
  # на момент ПЕРВОГО чистого замера, а не на конец выдержки.
  stable_clean_sec: 300
  # Регистр несброшенного кода неисправности (LAST_FAULT_CODE)
  last_fault_code_addr: 40012
  _source: TUNABLE

# ─── Два вида СТОПа: АВАРИЙНЫЙ и простой (v4.9.68) ──────────────────────────
# Стоп аварийный, если в момент его начала активна маска аварийной тяжести.
# Рез ровно один — там, где снята последняя активная аварийная маска: голова
# АВАРИЙНЫЙ СТОП, хвост простой «готов к пуску». Авария посреди простого стопа
# (кнопка на стоящей машине) вид не меняет и не режет — только перекрашивает.
# Раскатано на весь парк 19.09.2026 (v4.9.85) после сухого прогона по 45
# суткам боевой истории: 10 аварийных стопов, у всех построился акт с непустой
# лентой, все порезаны по снятию маски. Старые сплиттеры fault_cleared +
# shutdown_split пока оставлены под ключом — это путь отката.
stop_kind:
  enabled: true
  # Лаг стабилизации машины после аварийного останова, сек. Сопутствующие
  # неисправности — горячий останов, рост температуры при вставшей прокачке —
  # приходят уже после падения и относятся к той же аварии, поэтому окно акта
  # закрывается не раньше этого лага. Ничего не решает: только не даёт
  # обрезать запись, если маска ушла через полминуты. Конец окна в любом
  # случае не выходит за конец сегмента.
  stabilization_sec: 60
  # Сколько событий перед остановом показать в акте поштучно. Резать историю
  # по числу незачем: повторяющееся событие — одна строка со счётчиком, а
  # число ВИДОВ ограничено каталогом регистров и битов, а не длительностью.
  # Поэтому свод по видам покрывает всё окно целиком, а поштучно нужна лишь
  # окрестность останова, где важна каждая секунда. 0 — только свод.
  act_detail_events: 100
  # Окно данных акта — с последнего нормального останова, но не меньше этого
  # числа часов (решение владельца 13.10.2026, v5.1.16): серия попыток после
  # долгой стоянки и сама стоянка видны совету. До нормального останова — фон,
  # после — возможные предвестники. Фолбэк без нормального останова — сутки.
  act_min_window_h: 12
  # Код 40012 на закрытии сегмента (v5.1.22, P1-2): «сброшен», если «Сброс
  # неисправностей» (роль FAULT_RESET) поднимался не раньше стольких секунд до
  # снятия кода (плюс кадр опроса после) или переключатель ушёл в «Выкл» в кадре
  # снятия; иначе — «снят». Свой ключ, а не stabilization_sec: лаг акта на
  # другом двигателе поднимут, и «сброс» начал бы ловиться за минуты.
  # Данные 30 дней: 40569 за 11 с (#35931), в кадре снятия (#35941), за 1 с
  # (#35848); за 1 ч 47 мин (#35869) — это уже не сброс этого кода
  fault_reset_window_sec: 60
  # Лента отсчётов акта (v5.1.22, P1-4, решение В2): аналог сегмента падения
  # из уже загруженной истории окна — без повторного чтения. Колонки — пометка
  # incident_trace в mapping.yaml контроллера. Окно: от max(начало сегмента
  # падения, останов − before) до останова + after (сколько есть в окне: «Работа»
  # закрывается через 25–57 с после останова); в печати не больше max_rows
  # строк, ранние сворачиваются в «мин…макс»
  act_trace_before_sec: 600
  act_trace_after_sec: 30
  act_trace_max_rows: 40

# ─── Подтверждение выхода из стопа (v5.1.16) ────────────────────────────────
# 40011 — команда панели, а не физика: по команде пуска панель пишет «Прогрев»
# или «Номинал» до того, как провернулся коленвал. Выход из стопа (1/2/3 после
# 0) подтверждается ЛЮБЫМ из трёх независимых фактов — механика, электрика,
# панель страхуют друг друга (решение владельца 13.10.2026). Не подтвердился и
# вернулся в стоп — одна плашка стопа-исхода: «Неудачная работа · Авария/Стоп».
# Охлаждение 4/5 правило не трогает.
transition_confirm:
  enabled: true
  rpm_min: 250            # обороты выше прокрутки стартером (~100), ниже ХХ (~750)
  freq_min_hz: 5          # частота генератора: ниже — шум, не генерация
  ready_bits: []          # бит «Готов к нагрузке» — у контроллера (адрес, бит)
  carry_sec: 120          # показание пишется по изменению: держится не дольше
  rated_freq_min_hz: 46.5 # рабочая частота (50 Гц × 1400/1500): страховка оборотов
  # Рабочие обороты «Работы» — порог паспортной проверки масла
  # (detectors.yaml → OIL_DILUTION.passport_min_rpm, 1400): аналитика работы с
  # выхода на них, разгон с нулей пуска — переходный подсегмент без детекторов
  rundown_max_sec: 30     # сброс оборотов перед охлаждением 4/5/6 короче — переход
  no_data_share: 0.5      # попытка больше чем наполовину без связи — исход не объявляем
  anchor_check_sec: 900   # якорь акта: сколько от начала прошлой цепочки читать обороты
  _source: OWNER

# ─── Одиночный ноль источника (v5.1.17) ─────────────────────────────────────
# Декодер пишет «нулевой кадр»: обороты и/или давление масла ровно 0 одной
# точкой посреди работы (бывает вместе с током и мощностью). 18 точек за 30
# дней на трёх машинах. Ноль роли — сбой, если до и после него показания выше
# порога роли и между ними не больше max_gap_sec; нули других аналоговых
# регистров в том же кадре (± frame_tol_sec) уходят вместе с ним. Решение
# владельца 13.10.2026. Настоящий ноль держится (показание пишется по
# изменению) — следующее показание не рабочее или позже минуты, так не прячется.
zero_glitch:
  # ВЫКЛЮЧЕН 13.10.2026 (владелец): источник — heartbeat db-writer пишет значение
  # со стоянки с меткой «сейчас» сервера, пока пачка роутера с пуском в пути
  # (docs/outgoing/task_db-writer_heartbeat.md). Через неделю после исправления
  # db-writer проверить пуски; фильтр включить, если сбой останется
  enabled: false
  max_gap_sec: 60
  frame_tol_sec: 1
  stop_guard_sec: 15  # ноль внутри стопа или за 15 с до него — настоящий останов
  roles:
    RPM: 1000         # об/мин: рабочие соседи
    OIL_PRESS: 100    # кПа
  _source: OWNER

# ─── Сверка оборотов с частотой генератора (v5.1.21) ─────────────────────────
# ДГУ №1 15.10 04:42–09:24 МСК: 12 одиночных отсчётов 1417–1479 об/мин при
# 49,9–50,1 Гц, следом 1495–1501 — сбой датчика оборотов, а не провал.
# Частота опроса отсчёта — удержанное на момент отсчёта значение 40044 плюс
# строки частоты до следующего отсчёта оборотов (не дальше poll_window_max_sec):
# строка частоты приходит позже оборотов на 1 с (ДЭС №3) и на 4–8 с (ДГУ №1).
# k = RPM_UNDERSPEED.rated_rpm / LOAD_STEP.freq_nominal_hz = 30, порог —
# RPM_UNDERSPEED.threshold_rpm (1485). Решения владельца 15.10.2026 (В1, В4).
# Выключатель enabled — только фильтр сбоя, от zero_glitch.enabled не зависит.
rpm_freq_check:
  enabled: true             # фильтр сбоя: min_rpm < обороты < порога, вся частота
                            # опроса 40–55 Гц и k·f ≥ порог + tolerance_rpm (f ≥ 49,9),
                            # следующий отсчёт ≥ порога не позже next_max_gap_sec — отсчёт вырезается
  tolerance_rpm: 10
  freq_hold_max_sec: 1800   # удержание частоты (пока идут пакеты, до дыры data_gaps)
  freq_valid_hz: [40, 55]   # вне — частоте не верим, провал по оборотам
  poll_window_max_sec: 60
  next_max_gap_sec: 60
  min_rpm: 1000             # ниже — нули, выбег, ХХ, падение в стоп: не трогаем
  # Провал оборотов (В1): max(обороты, k·f_min опроса) < порога. false — правило
  # B: провал по оборотам после фильтра сбоя (живой край ждёт следующего отсчёта)
  dip_needs_freq: true
  remark_min_count: 3       # столько сбоев за сегмент и больше — строка в «Замечаниях» (В4)
  _source: OWNER

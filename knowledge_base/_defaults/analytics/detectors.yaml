# Параметры детекторов диагностических сценариев KTA50/PCC3300
# Источник: ТЗ аналитики, раздел 7.1; пороги из thresholds.yaml
# ХАРДКОД ЗАПРЕЩЁН: числа только здесь, код ссылается на конфиг.
# Изменение: только через веб-морду (раздел 9 ТЗ)
# Уровни: WARNING и SHUTDOWN выставляет ТОЛЬКО панель (CONTROLLER_FAULT). У
# аналитики severity_default — INFO или CAUTION; выше — понижается при загрузке
# с записью в лог (догма, подтверждено 11.10.2026, v5.1.7).

# ─── LOAD_STEP: Наброс/сброс нагрузки (Класс A — быстрые/электрические) ─────
# Gate: только RUN_STATE = 3. Вне него понятие «наброс/сброс» бессмысленно.
LOAD_STEP:
  enabled: true
  # Скорость изменения мощности → TRANSIENT-событие (Класс A: мгновенная скорость валидна)
  dP_dt_threshold_kw_per_s: 50.0   # |ΔP/Δt| > 50 кВт/с → анализировать переход
  # Пары отсчётов мощности ближе этого не учитываются в dP/dt (решение В-25.1):
  # пульс db-writer пишет ту же мощность второй строкой через доли секунды —
  # 9 ложных CAUTION за 60 дней (18.08–17.10)
  min_pair_dt_sec: 1

  # Штатный рампинг PCC: плавное изменение нагрузки управляемым образом.
  # Если смена нагрузки идёт с суммарной скоростью ≤ ramp_threshold_kw_per_s
  # в течение ramp_window_sec → это рампинг, а не аварийный сброс → INFO.
  ramp_window_sec: 20              # PCC Load Share Ramp дефолт, сек
  ramp_threshold_kw_per_s: 5.0    # "медленная" скорость → рампинг

  # Класс ГУ по ГОСТ ISO 8528-5 (определяет нормативы переходного процесса).
  # G3 — типичный класс для качественных ДГУ ответственного применения.
  load_class_iso: G3
  freq_nominal_hz: 50.0            # номинальная частота
  freq_settled_pct: 0.5            # коридор «частота восстановлена», % от номинала (±0.25 Гц)
  # Gate для freq_dip/rise/recovery: если RPM упали ниже этого % от максимума в подсегменте,
  # то это штатный останов/переход на ХХ, а не нагрузочный переходный процесс.
  # Артефакт freq_dip_pct=100% при остановке движка (Addendum v1.4, п.3) исключается.
  rpm_min_pct_for_freq_metrics: 50  # если min(RPM) < max(RPM)*50% → freq_dip не вычислять

  # Нормативы ГОСТ ISO 8528-5 по классам.
  # ВНИМАНИЕ: значения требуют сверки с официальным текстом ГОСТ!
  # Помечены _verify: true — использовать только после верификации.
  # _source: ISO8528-5, _verify: true
  iso_classes:
    G1:
      freq_drop_pct: 15.0    # максимальная просадка частоты при набросе, %
      freq_rise_pct: 18.0    # максимальный заброс частоты при сбросе, %
      freq_recovery_sec: 10  # время восстановления до коридора ±0.5%, сек
    G2:
      freq_drop_pct: 10.0
      freq_rise_pct: 12.0
      freq_recovery_sec: 5
    G3:
      freq_drop_pct: 7.0
      freq_rise_pct: 10.0
      freq_recovery_sec: 3
    G4:
      freq_drop_pct: 5.0
      freq_rise_pct: 7.0
      freq_recovery_sec: 2
  _verify: true  # нормативы ISO 8528-5 требуют сверки с официальным текстом ГОСТ
  severity_default: INFO
  _source: ISO8528-5

# ─── NEGATIVE_SEQUENCE: Ток обратной последовательности I₂ ─────────────────
# Физически корректная метрика несимметрии фаз (Addendum v1.5).
# Заменяет грубый перекос токов |I_k - I_avg|/I_avg, который НЕ соответствует
# заводской защите PCC3300 и завышает реальное значение в 6–8 раз.
#
# Метод А (точный): I₂ вычисляется через преобразование Фортескью по пофазным
# P и Q (whitelist дополнен 40035/36/37). Заводская защита (Neg Seq Overcurrent)
# реагирует именно на I₂, а не на разброс модулей токов.
#
# Заводская защита PCC3300 (0900-0670, раздел 8.29.4):
#   Threshold: 12% от I_nom (дефолт, диапазон 5-25%)
#   K Factor: 20; t_trip = K / (I₂%)²
#   Реакция: только Warning (не Shutdown)
# Мы предупреждаем РАНЬШЕ заводской защиты (сквозной принцип системы).
#
# Порог предупреждения — от паспорта ГЕНЕРАТОРА, а не от уставки панели
# (v4.9.97). Stamford AGN 016 (генераторы на Cummins): длительно I₂ ≤ 8%
# номинала, защиту рекомендуют ставить на 8%; IEC 60034-1:2010 табл. 2 для
# явнополюсных с косвенным охлаждением — тоже 0,08. Заводская уставка PCC3300
# 12% выше этого предела, прежние наши 10% — тоже. Калибровка 08.09–09.10.2026
# (ДГУ №1, ДЭС №3): в норме I₂ ≤ 1,9% номинала.
# Провал одной фазы I₂ почти не видит (29.09.2026 — 2–4% при L3 ≈ 10% от
# L1/L2): для этого PHASE_CURRENT_SPREAD и NEUTRAL_CURRENT ниже.
NEGATIVE_SEQUENCE:
  enabled: true
  method: A                           # A = пофазный Q (точно); B = через U (запасной)
  # Предупреждаем до паспортного предела генератора 8% (зазор перед ним)
  i2_proximity_warning_pct: 6.0      # I₂% ≥ этого дольше выдержки → CAUTION
  factory_threshold_pct: 12.0        # заводская уставка PCC3300, справочно
  norm_ref: "Stamford AGN 016, IEC 60034-1 табл. 2: длительно ≤8% I_ном"
  duration_warning_sec: 60           # держится > 60 сек → срабатывание
  # Номинальный ток для нормировки I₂%
  # 0 = вычислять из RATING_KW (предпочтительно); явное значение в A как резерв
  i_nominal_a: 0
  u_nominal_v: 400.0                 # линейное напряжение для расчёта I_nom
  pf_nominal: 0.8                    # номинальный PF для расчёта I_nom
  # Gate: только RUN_STATE=3 при ненулевом токе
  valid_run_states: [3]
  severity_default: CAUTION
  _source: CONTROLLER  # 12% — уставка neg-seq PCC3300, 0900-0670 раздел 8.29.4

# ─── PHASE_CURRENT_SPREAD: Перекос фазных токов ─────────────────────────────
# (I_max − I_min) в % номинального тока генератора, по реальным замерам.
# Видит то, чего не видит I₂: провал одной фазы, когда её ток уходит в
# нейтраль, а обратная последовательность почти не растёт.
#
# Нормы:
#   ПТЭД 1993 (Минтопэнерго, стационарные ДЭС ≥500 кВт) п. 4.1.8 — длительная
#     работа допустима при разности токов фаз ≤20% номинального, ни одна фаза
#     не выше номинала.
#   РД 34.45.501 пп. 2.33–2.35 — явнополюсные генераторы: те же 20% (≈10–14%
#     I₂); при превышении — меры в течение 2–5 мин, иначе разгрузка.
#   ГОСТ 33115-2014 табл. 3 п. 9 (и ГОСТ 13822-82) — генератор проектируется на
#     перекос до 25% номинального тока.
# Калибровка 08.09–09.10.2026 (ДГУ №1 1250 кВА, ДЭС №3 550 кВА): в норме до
# 12% / одиночные всплески до 23% короче 17 с; непрерывно ≥20% — ни разу.
# 29.09.2026 (Сининда, перед сгоранием повышающего трансформатора) — 25–50%,
# сработало бы в 11:00, за 2 ч 10 мин до отключения автомата. Порог 15% уже
# дал бы ложное: у ДЭС №3 был непрерывный участок 100 с.
PHASE_CURRENT_SPREAD:
  enabled: true
  spread_warning_pct: 20.0           # (I_max − I_min) / I_ном, %
  duration_warning_sec: 60           # непрерывно не короче
  valid_run_states: [3]
  severity_default: CAUTION
  norm_ref: "ПТЭД 1993 п. 4.1.8: разность токов фаз ДЭС ≤20% I_ном"
  _source: ПТЭД-1993 п.4.1.8; РД 34.45.501 п.2.33; ГОСТ 33115-2014

# ─── NEUTRAL_CURRENT: Ток нейтрали ──────────────────────────────────────────
# |I_L1 + I_L2 + I_L3| в % номинального тока генератора: модули фазных токов
# плюс углы по пофазным P и Q (те же, что у I₂), напряжения симметричны.
# Панель PCC3300 ток нейтрали не контролирует — защиты 50N/51N у неё нет
# (ground fault — только с внешним ТТ), это видит только аналитика.
#
# Нормы:
#   ГОСТ 11677-85 п. 3.9.6 / ГОСТ Р 52719-2007 п. 6.2.5 — нейтраль НН силового
#     трансформатора Y/Yн рассчитана на 25% номинального тока длительно
#     (Д/Yн и Y/Zн — 75%).
#   Stamford AGN 017 — нагрузка фаза–нейтраль не более 25% номинального тока
#     генератора.
#   IEC 60034-1 п. 7.2.2 — генератор проектируется на I₀ ≤5% от I₁: в
#     4-проводной сельской сети это обычный режим (ДГУ №1 — около 7%), как
#     порог не годится.
# Схема и мощность трансформатора у каждого объекта свои — предел для Д/Yn
# втрое выше, но на стороне генератора действует 25% по Stamford.
# Калибровка 08.09–09.10.2026: в норме до 19% у ДГУ №1, всплеск 31% на 17 с у
# ДЭС №3; непрерывно ≥25% дольше 60 с — ни разу. 29.09.2026 — 40–86%.
NEUTRAL_CURRENT:
  enabled: true
  neutral_warning_pct: 25.0          # |Σ I_k| / I_ном, %
  duration_warning_sec: 60           # непрерывно не короче
  valid_run_states: [3]
  severity_default: CAUTION
  norm_ref: "ГОСТ 11677-85 п. 3.9.6, Stamford AGN 017: ток нейтрали ≤25% I_ном"
  _source: ГОСТ 11677-85 п.3.9.6; ГОСТ Р 52719-2007 п.6.2.5; Stamford AGN 017

# ─── COOLING_FAILURE: Отказ охлаждения ──────────────────────────────────────
COOLING_FAILURE:
  enabled: true
  # v5.1.15 (решение владельца 13.10, вариант Г): ТРЕНДА НЕТ. Датчик ОЖ шагает
  # по 1 °C и пишет по изменению — наклон по подсегменту считался по 2–3
  # показаниям, качание термостата 84→85 давало «устойчивый тренд» (ДЭС №3 — 76,
  # ДГУ №1 — 58 ложных за 73 дня вне жары). Главная проверка — близость к
  # уставке HCT Warning панели по максимуму ОЖ: в работе всегда, при любом
  # наклоне и значении на начало (перегревы 13–16.09 и 18.08 ловит); дальше
  # страхуют LIMIT_PROXIMITY (уставка останова) и сама панель.
  # Минимальная длительность подсегмента для применения детектора
  min_segment_duration_sec: 300         # для прогрева; близость — на подсегменте любой длины
  # Прогрев (фаза 1): предиктор асимптоты при входе в рабочий диапазон —
  #   coolant_temperature.tunable.working_range_low_c / asymptote_norm_max_c
  #   (thresholds.yaml слоя двигателя)
  # Гейт по режиму: только RUN_STATE=3 (установившаяся работа)
  # Приближение к порогу HCT Warning (по max-значению за подсегмент)
  proximity_warning_pct: 10          # coolant_max > HCT_warning - 10% → CAUTION
  severity_default: CAUTION
  _source: TUNABLE

# ─── OIL_DILUTION: Разжижение/перегрев масла ────────────────────────────────
OIL_DILUTION:
  enabled: true
  # Валидные режимы: давление масла = 0 на остановленном моторе — норма, не диагноз.
  valid_run_states: [3]
  # Совместное срабатывание: давление масла падает И температура растёт.
  # ВЫКЛЮЧЕНО 17.10.2026 (v5.1.23, решение владельца В6 = А): за 60 дней все
  # срабатывания (4 в перерасчёте, 6 живых эпизодов) — нормальный прогрев после
  # холодного пуска или нулевой кадр. Паспортная ветка ниже работает. Нет
  # ключа — ветка включена, как до v5.1.23
  combined_enabled: false
  oil_press_drop_kpa: 50          # падение OIL_PRESS на > 50 кПа от медианы подсегмента
  oil_temp_rise_c: 10             # одновременный рост OIL_TEMP на > 10 °C
  concurrent_window_sec: 300      # в пределах 5 минут
  # Паспорт — из слоя двигателя (thresholds.yaml: oil_pressure.passport.rated_min_kpa),
  # v5.1.12: копии 310 от KTA50 больше нет — QSX15 сравнивался с чужим порогом
  passport_min_run_sec: 60        # ниже паспорта непрерывно не меньше (как перекос фаз)
  passport_min_rpm: 1400          # только на рабочих оборотах (нули стоящего мотора — не нарушение)
  passport_step_max_pct: 5        # допуск «шаг датчика» не больше 5 % паспорта (сломанный датчик)
  severity_default: CAUTION
  _source: TUNABLE

# ─── COKING_RISK: риск нагара / wet stacking — НАКОПЛЕННОЕ СОСТОЯНИЕ ────────
# Долг до прожига (v5.1.3, решения владельца 11.10.2026; основание —
# docs/plans/research_coking_wet_stacking.md). Копится при недогрузе, стоп его
# не снимает, снимает только работа под нагрузкой. В стопе не «обнаруживается»:
# в сводке — «перед пуском» с датами накопления. Порог малой нагрузки и
# минимальный отрезок прожига — thresholds.yaml engine_operation.tunable
# (purge_min_load_pct = 30 % standby — Cummins PT #7007, NFPA 110;
# purge_min_duration_sec = 900 — источники не засчитывают прожиг короче).
COKING_RISK:
  enabled: true
  # Уровни — по непогашенному остатку каждого счётчика с последнего полного прожига
  risk_yellow_low_load_sec: 7200     # 2 ч малой нагрузки
  risk_red_low_load_sec: 14400       # 4 ч — Cat LEXE0832 (30 мин на 4 ч), Fort Calhoun, EMD (3 ч)
  risk_yellow_idle_sec: 3600         # 1 ч х.х. суммарно (после часа х.х. — прожиг)
  risk_red_idle_sec: 10800           # 3 ч — инструкция машинисту CN, форма 8960
  risk_yellow_cold_sec: 3600         # 1 ч работы с ОЖ < 60 °C
  risk_red_cold_sec: 10800           # 3 ч (Cummins O&M: при ОЖ ≤60 °C топливо смывает масло)
  # Долг — в «минутах малой нагрузки»: х.х. вреднее (MAN: без нагрузки ≤1 ч против ~200 ч при 17 %)
  debt_weight_idle: 2.0
  debt_weight_cold: 1.0
  # Прожиг — пропорциональный зачёт: минута при ≥ purge_min_load_pct гасит
  # purge_rate_low минут долга (Cat: 30 мин на 4 ч ≈ 1:8), при ≥ purge_high_load_pct —
  # purge_rate_high (MAN: ~1,2 ч при >70 % после 19 ч при 10 %)
  purge_rate_low: 8.0
  purge_high_load_pct: 70
  purge_rate_high: 16.0
  purge_min_coolant_c: 60            # прожиг засчитывается при прогретой ОЖ
  # Провал ниже порога короче допуска отрезок прожига не рвёт — шум регулирования у
  # границы 30 % (решение 11.10.2026: ДЭС №3 работает у порога, без допуска в прожиг
  # попадало 23 % времени при ≥30 %)
  purge_dip_tolerance_sec: 60
  # По Cummins (v5.1.5, docs/plans/research_cummins_light_load.md). Потолка долга у
  # Cummins нет; штатное лечение — годовой прогон T-030 §7.5.5 (≥3 ч, из них 1 ч около
  # номинала) = 32 ч в наших ставках. Долг выше — «нужен сервисный прожиг» (осмотр
  # выпуска/турбины, ступенчатый прогон, проба масла на топливо — SB 3810340, 5 %)
  service_purge_debt_sec: 115200
  # Прогон по T-030 засчитывается как полный прожиг
  t030_run_min_sec: 10800
  t030_high_pct: 75                  # «около номинала»: Cummins числа не даёт, 75 % — NFPA 110
  t030_high_min_sec: 3600
  # Календарь прогонов: ежемесячно ≥30 мин при ≥30 % (A035B516, T-030 §7.5.3), ежегодно — T-030
  monthly_run_min_sec: 1800
  monthly_period_days: 30
  annual_period_days: 365
  severity_default: CAUTION
  _source: PASSPORT_РЭ + отраслевые нормы (research_coking_wet_stacking.md)

# ─── NO_LOAD_TOO_LONG: без нагрузки на номинальных оборотах дольше нормы ─────
# Замечание сегмента (v5.1.5). Cummins A035B516 вып. 6 §5.4.2: без нагрузки — не
# дольше 15 мин подряд. Холостой ход (RUN_STATE 2/5) — отдельно, IDLE_TOO_LONG.
NO_LOAD_TOO_LONG:
  enabled: true
  load_pct: 10
  max_continuous_sec: 900
  severity_default: CAUTION
  _source: CUMMINS  # A035B516 вып. 6 §5.4.2

# ─── IDLE_TOO_LONG: непрерывный холостой ход дольше нормы РЭ ────────────────
# Замечание сегмента (v5.1.3). Норма — один отрезок х.х.: K38-50 РЭ, Cummins
# O&M — не более 10 мин (код панели 2342 Max Idle Time — тоже непрерывный).
# Суммарный х.х. идёт в долг риска нагара (COKING_RISK), а не сюда.
IDLE_TOO_LONG:
  enabled: true
  max_continuous_sec: 600
  severity_default: CAUTION
  _source: PASSPORT_РЭ  # K38-50_РЭ_и_ТО, Cummins O&M

# ─── WARMUP_VIOLATION: Нарушение прогрева ───────────────────────────────────
WARMUP_VIOLATION:
  enabled: true
  # Минимальная длительность прогрева при холодном пуске (ОЖ < cold_start_coolant_c)
  min_warmup_sec: 180              # из thresholds.yaml, engine_operation.passport.warmup_min_sec
  cold_start_coolant_c: 21        # из thresholds.yaml, engine_operation.passport.cold_start_coolant_c
  # Требование к прогреву при ГОРЯЧЕМ пуске (ОЖ >= cold_start_coolant_c)
  # 0 = прогрев не обязателен; можно задать мягкое требование, напр. 60 сек
  hot_start_warmup_sec: 0
  # v5.1.10: только у головы работы, по цепочке от ближайшего стопа. Пуск без фазы
  # прогрева — норма парка (настройка панели): тёплый — запись без замечания,
  # холодный — первый сезон наблюдением (решение 12.10); короткий прогрев при
  # холодном пуске — разовое событие
  severity_default: CAUTION
  _source: PASSPORT_РЭ

# ─── COOLDOWN_VIOLATION: Нарушение охлаждения перед остановом ───────────────
# Разовое событие (v5.1.10, решения владельца 12.10): у головы стопа после работы.
# Нарушение — от последней нагрузки ≥ load_pct_threshold до останова прошло меньше
# min_cooldown_sec. Режим докрутки без нагрузки не важен (фаза 4/5, ХХ, снятая
# нагрузка на номинале) — так же считает панель (43800 Rated Cooldown Time: время
# на номинале при нагрузке < 10 % перед штатным остановом). Часто вместо штатного
# расхолаживания просто снимают нагрузку — это охлаждение. Нет данных о нагрузке
# или обрыв связи на отрезке, от которого зависит вывод, — «не оценено», без замечания.
COOLDOWN_VIOLATION:
  enabled: true
  load_pct_threshold: 30          # ниже — недогруз, турбина не горячая
  min_cooldown_sec: 180           # Cummins: 3–5 мин без нагрузки перед остановом
  load_hold_max_sec: 1800         # ряд LOAD_PCT пишется по изменению (пульс ~15 мин): замер
                                  # перед окном старше этого не считается удержанным
  severity_default: CAUTION
  _source: PASSPORT_РЭ

# ─── START_FAILURE: Проблема пуска ──────────────────────────────────────────
START_FAILURE:
  enabled: true
  # Давление масла не появилось за нормативное время
  oil_press_rise_time_alarm_sec: 15   # из thresholds.yaml, engine_operation.passport.oil_press_rise_time_sec
  # Просадка АКБ при прокрутке стартера
  battery_sag_alarm_v: 19.0           # из thresholds.yaml, battery_voltage.tunable.sag_alarm_v
  # Длительность RUN_STATE=1 (Time Delay to Start / прокрутка)
  crank_time_alarm_sec: 45            # > 3 × 15 сек (3 попытки без учёта перерывов)
  severity_default: CAUTION
  _source: PASSPORT_РЭ

# ─── THERMAL_HIGHLOAD: Перегрев от высокой нагрузки ─────────────────────────
THERMAL_HIGHLOAD:
  enabled: true
  zone: ELEVATED
  # Приближение к порогам (берём из thresholds.yaml динамически)
  coolant_proximity_pct: 10        # coolant > HCT_warning - 10% → в trigger (уровень CAUTION)
  oil_proximity_pct: 10            # oil > HOT_warning - 10% → в trigger (уровень CAUTION)
  # Уровни теплового риска (сквозной аккумулятор)
  risk_yellow_elevated_sec: 3600   # 60 мин в ELEVATED → YELLOW
  risk_red_elevated_sec: 7200      # 120 мин в ELEVATED → RED
  coolant_near_limit_pct: 5        # coolant в пределах 5% от warning → "вблизи порога"
  oil_near_limit_pct: 5
  # Спад теплового риска вне зоны ELEVATED (обратимый риск — физика: снятие нагрузки → охлаждение)
  # Скорость спада: на 1 сек простоя вне ELEVATED накопитель уменьшается на thermal_decay_rate_per_sec сек.
  # Пример: 0.5 → за 2 мин без нагрузки «прощается» 1 мин теплового риска.
  thermal_decay_rate_per_sec: 0.5
  severity_default: CAUTION
  _source: TUNABLE

# ─── LIMIT_PROXIMITY: Близость к паспортному порогу ─────────────────────────
LIMIT_PROXIMITY:
  enabled: true
  # Валидные режимы: давление масла 0 на стопе — норма, не приближение к аварии.
  valid_run_states: [3]
  # Предупреждать когда любой параметр приближается к паспортному/контроллерному порогу
  proximity_pct: 10               # в пределах X% от порога → CAUTION
  # Конкретные пороги берутся из thresholds.yaml:
  # OIL_PRESS → oil_pressure.controller.shutdown_rated_kpa
  # COOLANT_TEMP → coolant_temperature.controller.shutdown_c
  # OIL_TEMP → oil_temperature.controller.shutdown_c
  severity_default: CAUTION
  _source: TUNABLE

# ─── STOP_PROFILE: Профиль останова (наблюдение) ────────────────────────────
# На голове стопа (RUN_STATE=0 после смены режима) — за сколько обороты упали.
# С v5.1.7 только проверка rpm_stop_profile, БЕЗ детекции и уровня: на вердикт не
# влияет. Отказ останова — авария самой панели (PCC3300: код 1245 «Неисправность
# при останове двигателя», SHUTDOWN, маска 40405/15; 40407/3 FailtoShutdown — это
# 1416 Battle Short), аналитика её не дублирует (решение владельца 11.10.2026). Пороги —
# segmentation.yaml → transitions (T_stop_max_sec, T_stop_violation_sec).
STOP_PROFILE:
  enabled: true
  _source: TUNABLE

# ─── RPM_UNDERSPEED: Просадка оборотов под нагрузкой ────────────────────────
# Детектор закрывает дыру: панель (код 1448) глушит только при удержании
# ниже 90% (1350 об/мин) ~10 сек. Блок ловит мгновенные провалы,
# которые панель пропускает. Политика «строже панели»: порог 1350 + 10% = 1485.
# Gate: только RUN_STATE=3 (под нагрузкой).
# Задержка: НЕТ — любой мгновенный провал ниже порога = детекция.
# Источник: Addendum v1.6; нормативная опора: код 1448, PCC_3_3_Rus.pdf стр.120.
RPM_UNDERSPEED:
  enabled: true
  threshold_rpm: 1485        # = panel_setpoint_rpm + 10% (политика «строже панели»)
  panel_setpoint_rpm: 1350   # уставка панели (код 1448, underfreq 90%)
  rated_rpm: 1500            # справочно: 50 Гц = 1500 об/мин
  require_run_state: 3       # только под нагрузкой
  hold_sec: 0                # без задержки — ловим мгновенный провал
  severity_default: CAUTION
  fault_code: 1448
  _source: CONTROLLER        # код 1448 «Пониженная частота», PCC_3_3_Rus.pdf стр.120

# ─── RPM_OVERSPEED: Заброс оборотов (v5.1.23) ───────────────────────────────
# Панель глушит разнос (код 234) на уставке rpm.controller.overspeed_rpm из
# thresholds.yaml двигателя (KTA50 и QSX15 — 1725 об/мин). Порог аналитики —
# 1575 об/мин = уставка 1725 − 150 (91,3 % уставки; решение владельца В2′
# 17.10.2026 по данным 60 дней — пересмотр В2 «на 10 % строже панели» = 1552,5):
# порог = уставка × (1 − proximity_pct/100) — считается в коде, здесь не
# хранится. Сравнение строгое «выше»: 1575 об/мин — ещё не заброс.
# Отсчёт — заброс, если выше порога и обороты, и 30·f_max частоты опроса (как
# провал v*, analytics/rpm_freq.py). Частоте верим в freq_valid_hz — шире, чем
# у провала (1696 об/мин 16.10 шли при 56,8 Гц). Без частоты детекции нет.
# Только по участкам (analytics/live.py) и только RUN_STATE=3. Вне пуска (сброс
# нагрузки) гейт снимать вправе (В3). За 60 дней (18.08–17.10) при 1575 — у ДГУ
# 3 эпизода на пусках без нагрузки (1696, 1584, 1606), у ДЭС №3 2 на скачках
# нагрузки (02.09 и 05.09, оба 1584); при 1552,5 у ДЭС №3 в режиме 19.08–16.09
# было бы 36 одиночных эпизодов (1553–1584 об/мин, 51,8–52,8 Гц).
RPM_OVERSPEED:
  enabled: true
  proximity_pct: 8.69565     # = 150/1725: порог 1575 об/мин = уставка 1725 − 150 (В2′ 17.10, 60 дней)
  freq_valid_hz: [40, 65]    # вне — частоте не верим, заброса нет
  severity_default: CAUTION
  fault_code: 234            # справочно (ref_codes): «Разнос двигателя»
  _source: CONTROLLER        # код 234, 0900-0670 стр.278 (Overspeed Shutdown, 50 Гц)

# ─── DETECTION_COUNTER: Счётчик срабатываний (универсальный) ─────────────────
# Считает ФРОНТЫ (события), не точки. Сырые срабатывания ДО гейта.
# Источник: auto_segments (онлайн); analysis_runs НЕ учитываются (double-count).
DETECTION_COUNTER:
  enabled: true
  window_days: 30            # TUNABLE: окно подсчёта в днях

# ─── ALARM_EPISODES: эпизоды тревог (online/engine.py) ──────────────────────
# Остальные ключи блока (close_debounce_cycles, trip_trend_window_min,
# event_seed_after_sec) — умолчания в коде.
# analytics_counts_since — переходный месяц v5.1.21 (решение владельца В5,
# 15.10.2026): счётчики аналитики «за 30 дней» и «с пуска» (гейт, отчёт,
# заключение) считают только эпизоды с t_open не раньше этой даты — до
# выкладки эпизоды строились по границам подсегмента («24 ч» от одного
# отсчёта). Панель не затрагивается. Значение — дата (и время) выкладки:
# 2026-10-16 (полночь в поясе сервиса) или 2026-10-16T14:00:00+03:00.
# Пусто — без фильтра. СНЯТЬ после ≈15.11.2026: при старте сервиса, если
# ключу больше 35 дней, — предупреждение в журнале.
# Дублируется в legacy-монолите equipment/cummins_kta50_pcc3300.
ALARM_EPISODES:
  analytics_counts_since: "2026-10-16"   # выкладка v5.1.21; СНЯТЬ после 15.11.2026

# ─── CONTROLLER_FAULT: Активная неисправность контроллера ───────────────────
CONTROLLER_FAULT:
  enabled: true
  # Срабатывает при появлении нового бита в fault_history (диапазон по whitelist mapping.yaml)
  # Severity берётся из fault_matrix.yaml по severity бита (bitmap_severity_map)
  # НЕ эвристика — строго по матрице приоритетов
  severity_default: WARNING
  # CommonAlarm-паттерн (несброшенная неисправность → CAUTION) настраивается
  # в слое контроллера/оборудования: common_alarm_addr / common_alarm_bit /
  # unconfirmed_severity. Без этих ключей паттерн выключен.
  _source: CONTROLLER

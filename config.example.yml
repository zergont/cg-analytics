# ══════════════════════════════════════════════════════════════════════════════
# cg-analytics — конфигурация
# Скопируйте в config.yml и заполните значения.
# config.yml добавлен в .gitignore — не попадает в репозиторий.
# ══════════════════════════════════════════════════════════════════════════════

# ── Базы данных ───────────────────────────────────────────────────────────────
databases:
  # Основная БД телеметрии (TimescaleDB/PostgreSQL)
  source: postgresql://user:pass@192.168.1.10:5432/telemetry
  # Аналитическая БД (отдельный инстанс PostgreSQL)
  analytics: postgresql://analytics:pass@localhost:5432/analytics
  # Таймаут запросов к source БД (сек). Увеличьте при catch-up окнах >1 суток через WAN/VPN.
  source_query_timeout: 120
  # ── Ожидания у source-БД — только со сроком (v5.1.24). Ключи необязательны,
  #    ниже — умолчания. Вычисляемые от source_query_timeout оставлены
  #    закомментированными: явное значение не следует за поднятым
  #    source_query_timeout (statement_timeout 110 с снимал бы на сервере
  #    каждый запрос дольше 110 с при query_timeout 300).
  # Ожидание свободного соединения пула (сек; по умолчанию = source_query_timeout)
  # source_acquire_timeout: 120
  # Подключение нового соединения (сек)
  source_connect_timeout: 30
  # Возврат соединения в пул после успешного запроса (сек; сброс сессии ≈ 1 RTT)
  source_release_timeout: 10
  # statement_timeout сессии (сек): сервер снимает запрос сам раньше клиента.
  # По умолчанию = source_query_timeout − 10; 0 — не ставить; не меньше
  # source_query_timeout — поправляется вниз (до −10 с)
  # source_statement_timeout: 110
  # TCP keepalive сокетов: простой до первой пробы / интервал проб / число проб (сек, сек, шт.)
  source_keepalive_idle: 60
  source_keepalive_interval: 10
  source_keepalive_count: 6
  # TCP_USER_TIMEOUT (сек, только Linux; 0 — не ставить): неподтверждённые данные
  # висят не дольше этого — затем соединение рвётся
  source_tcp_user_timeout: 120
  # Закрытие пула при остановке сервиса (сек); не закрылся — соединения обрываются
  pool_close_timeout: 10

# ── Сторож движков онлайн-наблюдения (v5.1.24) ────────────────────────────────
# Движок, у которого нет продвижения дольше stall_sec, перезапускается — только
# эта машина, тем же путём, что при старте сервиса. Ключи необязательны.
watchdog:
  # false — сторож только пишет ERROR со стеком задачи и ничего не отменяет
  enabled: true
  # Период проверки (сек; проверка — только память)
  tick_sec: 30
  # Нет продвижения дольше — движок завис (сек; не меньше 3 × интервал опроса + 60)
  stall_sec: 600
  # Ожидание конца отменённой задачи движка (сек)
  cancel_wait_sec: 15
  # Не больше max_restarts перезапусков зависшего движка за restart_window_sec (сек)
  max_restarts: 3
  restart_window_sec: 3600
  # Цикл движка дольше — WARNING в журнал (сек)
  cycle_warn_sec: 120
  # Тик синхронизации history дольше — прерывается (сек)
  history_sync_tick_timeout: 300

# ── Anthropic API ─────────────────────────────────────────────────────────────
anthropic:
  api_key: sk-ant-api03-...
  # Модель агента. Обновлять при выходе новых версий Sonnet.
  model: claude-sonnet-4-6
  # Максимум вызовов инструментов за один отчёт (защита от зацикливания)
  max_tool_calls: 10
  # Максимум токенов в ответе агента
  max_tokens: 8096
  # HTTP-прокси для доступа к API (если сервер за WireGuard без прямого интернета)
  # Формат: http://user:password@host:port
  # proxy: http://analytics:password@31.59.170.218:58889

# ── Расписание суточных отчётов ───────────────────────────────────────────────
# Время в UTC. По умолчанию 21:05 UTC = 00:05 МСК (UTC+3).
# Измените если сервер в другом часовом поясе.
schedule:
  hour: 21
  minute: 5

# ── Knowledge Base ────────────────────────────────────────────────────────────
knowledge_base:
  # Путь к папке knowledge_base/ (абсолютный или от рабочей директории)
  path: ./knowledge_base

# ── Web UI ────────────────────────────────────────────────────────────────────
web:
  host: 0.0.0.0
  port: 8090

# ── Логирование ───────────────────────────────────────────────────────────────
# Уровни: DEBUG, INFO, WARNING, ERROR
logging:
  level: INFO
